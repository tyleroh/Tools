name: PingMe签到
description: PingMe每日签到与任务，默认0点整每3小时签到一次｜支持签到参数抓取｜代理策略可自由填写｜自动同步 mickeu/Egern 原版更新
compat_arguments:
  arg3: '0 */3 * * *'
  PROXY: DIRECT
compat_arguments_schema:
  arg3:
    name: PM定时
    default_value: '0 */3 * * *'
  PROXY:
    name: 代理策略
    description: 输入策略组名称
    default_value: DIRECT
env:
  PINGME_CAPTURE: 'true'
env_schema:
  PINGME_CAPTURE:
    name: PM'token
    description: 关闭后不再抓取签到参数（默认开启 true）。每运行一次随机生成设备ID，防止被检测。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
author: mickeu 修改为Egern版（添加随机设备ID与参数开关）
icon: https://raw.githubusercontent.com/axhani/icon/refs/heads/main/pingme&wetalk.png
dns: {}
rules:
- domain:
    match: api.pingmeapp.net
    policy: PROXY
scriptings:
- schedule:
    name: PingMe签到
    cron: '{{{arg3}}}'
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/PingMeSignin.js?t=2
    timeout: 300
    update_interval: 3600
- http_request:
    name: PingMe获取签到参数
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/pingme_capture.js?t=2
    timeout: 60
    update_interval: 3600
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net