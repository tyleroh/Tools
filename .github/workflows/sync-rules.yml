name: Sync Rules
on:
  schedule:
    - cron: '0 20 * * 6' # UTC时间，北京时间每周日凌晨4点执行
  workflow_dispatch: # 允许网页端手动点击运行

permissions:
  contents: write # 必须：授予推送代码的权限

jobs:
  merge-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Deduplicate and Merge Rules
        run: |
          TARGET_FILE="Surge/Rules/AI.list"
          
          cat << 'EOF' > merge_script.py
          import urllib.request
          import sys
          import os

          target_file = sys.argv[1]
          
          urls = [
              "https://github.com/fmz200/wool_scripts/raw/main/Loon/rule/AI.list",
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Crypto/Crypto.list"
          ]
          
          seen_rules = set()
          extracted_lines = []
          
          # 需要屏蔽的其他无用元数据前缀
          ignore_prefixes = (
              '# AUTHOR:', '# REPO:', '# UPDATED:', '# TOTAL:', 
              '# DOMAIN:', '# DOMAIN-KEYWORD:', '# DOMAIN-SUFFIX:', 
              '# IP-CIDR:', '# IP-CIDR6:', '# IP-ASN:', '# USER-AGENT:', 
              '# PROCESS-NAME:', '# URL-REGEX:', '# DESC:'
          )
          
          for url in urls:
              try:
                  req = urllib.request.urlopen(url)
                  content = req.read().decode('utf-8')
                  
                  in_header = True
                  for line in content.splitlines():
                      line = line.strip()
                      if not line:
                          if not in_header:
                              extracted_lines.append("")
                          continue
                          
                      if line.startswith('#!') or set(line) == {'#'}:
                          continue
                      else:
                          in_header = False
                      
                      # 处理注释行
                      if line.startswith('#'):
                          upper_line = line.upper()
                          
                          # 将 '# NAME: Crypto' 转换为 '# Crypto'
                          if upper_line.startswith('# NAME:'):
                              name_val = line.split(':', 1)[1].strip()
                              # 在新分类前增加一个空行（如果上一行不是空行）
                              if extracted_lines and extracted_lines[-1] != "":
                                  extracted_lines.append("")
                              extracted_lines.append(f"# {name_val}")
                              continue
                              
                          # 屏蔽其他仓库的元数据
                          if upper_line.startswith(ignore_prefixes):
                              continue
                              
                          # 保留正常的分类标签（如 # AI）
                          extracted_lines.append(line)
                      else:
                          # 核心去重逻辑：如果这条规则没见过，才加入列表
                          if line not in seen_rules:
                              seen_rules.add(line)
                              extracted_lines.append(line)
                              
              except Exception as e:
                  print(f"Error fetching {url}: {e}")
                  sys.exit(1)

          # 清理连续的空行，美化排版
          clean_lines = []
          for line in extracted_lines:
              if line == "" and (not clean_lines or clean_lines[-1] == ""):
                  continue
              clean_lines.append(line)
              
          upstream_rules = "\n".join(clean_lines).strip()
          
          if not os.path.exists(target_file):
              print(f"Error: Target file {target_file} not found!")
              sys.exit(1)
              
          with open(target_file, 'r', encoding='utf-8') as f:
              local_content = f.read()
              
          marker = "# My Rules"
          if marker not in local_content:
              print(f"Error: Marker '{marker}' not found in target file!")
              sys.exit(1)
              
          my_rules_part = local_content[local_content.find(marker):]
          
          header = "# AI分流\n# 来源订阅: \n# " + "\n# ".join(urls) + "\n\n"
          final_content = f"{header}{upstream_rules}\n\n\n{my_rules_part}\n"
          
          with open(target_file, 'w', encoding='utf-8') as f:
              f.write(final_content)
              
          print("Rules synced, deduplicated, and merged successfully.")
          EOF
          
          python3 merge_script.py "$TARGET_FILE"
          rm merge_script.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Surge/Rules/AI.list
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto sync and deduplicate AI rules" && git push)
